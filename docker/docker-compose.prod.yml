name: faceitlutch-prod

services:
  mariadb:
    image: mariadb:10.11
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASS:-supersecret}
      MARIADB_DATABASE: faceitlutch_db
      MARIADB_USER: ${DB_USER:-root}
      MARIADB_PASSWORD: ${DB_PASS:-supersecret}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    restart: always
    env_file:
      - ../.env
    ports:
      - "80:3000"
    environment:
      DB_HOST: mariadb
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-supersecret}
      DB_NAME: faceitlutch_db
    depends_on:
      mariadb:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  mariadb_data:
